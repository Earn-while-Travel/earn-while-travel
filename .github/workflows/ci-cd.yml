name: Java 17 CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger when pushing to the main branch
  pull_request:
    branches:
      - main  # Trigger for pull requests targeting the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # Run the build on the latest Ubuntu runner

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adoptopenjdk'  # You can also use 'zulu' or others if preferred

      # Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository  # Path for Maven dependencies cache
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}  # Cache key based on pom.xml
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build the Spring Boot application with Maven
      - name: Build with Maven
        run: mvn clean install -DskipTests  # Skip tests during build for faster feedback

      # Run tests using Maven
      - name: Run tests with Maven
        run: mvn test

      # Optional: Deploy your application (e.g., to Heroku, AWS, Docker, etc.)
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Example: deploy to a server, AWS, Docker, Heroku, etc.
