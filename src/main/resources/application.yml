spring:
  datasource:
    url: ${DB+URL}
    username: ${DB-User-Name}
    password: ${DB_USER_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /

server:
  port: 8600
  servlet:
    context-path: /ewt

logging:
  level:
    com.zaxxer.hikari: ERROR  # 🔹 Correct indentation here!
