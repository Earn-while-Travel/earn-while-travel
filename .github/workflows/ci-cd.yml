name: Java 17 CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Setup Java JDK (Java 17)
      - name: Setup Java JDK
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'  # Specify the version of Java
          distribution: 'adoptopenjdk'  # Java distribution (e.g., adoptopenjdk or zulu)
          java-package: 'jdk'  # Use JDK package type (default is 'jdk')
          architecture: 'x64'  # Architecture type (typically 'x64' for 64-bit systems)
          check-latest: false  # Option to check the latest available version (set to false)
          server-id: 'github'  # Default is 'github' for Maven repository ID
          server-username: ${{ github.actor }}  # GitHub actor (username for authentication)
          server-password: ${{ github.token }}  # GitHub token for authentication
          settings-path: ~/.m2  # Path to Maven settings.xml file
          overwrite-settings: true  # Overwrite the existing settings.xml file if it exists
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}  # Optional: GPG private key for signing
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}  # Optional: GPG passphrase for signing
          cache: 'maven'  # Enable Maven dependency caching
          cache-dependency-path: '**/pom.xml'  # Path to pom.xml for caching dependencies
          job-status: ${{ job.status }}  # Pass job status to post-job step
          token: ${{ github.token }}  # Token for authenticating with GitHub's package registry
          mvn-toolchain-id: 'adoptopenjdk_17'  # Maven toolchain ID for Java 17 (optional)
          mvn-toolchain-vendor: 'adoptopenjdk'  # Maven toolchain vendor (optional)

      # Build the project with Maven (without tests)
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # Run tests with Maven
      - name: Run tests with Maven
        run: mvn test

      # Deploy to production (this is a placeholder, adjust based on your deployment process)
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."

      # Clean up orphan processes (to ensure no lingering processes after the build)
      - name: Clean up orphan processes
        run: |
          ps aux | grep '[o]rphan_process' | awk '{print $2}' | xargs kill -9 || true
