name: Java 17 CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Trigger when pushing to the develop branch
  pull_request:
    branches:
      - develop  # Trigger for pull requests targeting the develop branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Setup Java JDK 17 (AdoptOpenJDK or Zulu)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v2  # Stable version
        with:
          java-version: '17'  # Set Java version to 17
          distribution: 'adoptopenjdk'  # Corrected distribution name (AdoptOpenJDK)

      # Cache Maven dependencies (for faster builds)
      - name: Cache Maven dependencies
        uses: actions/cache@v3  # Updated to v3
        with:
          path: ~/.m2/repository  # Cache Maven dependencies
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}  # Cache key based on pom.xml
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build with Maven
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # Run tests with Maven
      - name: Run tests with Maven
        run: mvn test

      # Optional: Deploy to production (you can replace this with actual deployment steps)
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."

      # Clean up orphan processes (if needed)
      - name: Clean up orphan processes
        run: |
          ps aux | grep '[o]rphan_process' | awk '{print $2}' | xargs kill -9 || true
