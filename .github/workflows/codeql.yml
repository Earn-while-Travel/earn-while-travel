name: "CodeQL SAST SCAN"

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '43 4 * * 0'  # Weekly scan

jobs:
  analyze:
    name: Analyze Java & Kotlin Code
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual  # Required for Maven builds

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK (AdoptOpenJDK)
      uses: actions/setup-java@v3
      with:
        distribution: 'adopt'  # Using AdoptOpenJDK
        java-version: '17'  # Change if using a different version
        cache: 'maven'

    - name: Set up Maven
      run: |
        mvn -version

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended,security-and-quality  # Enables log injection detection

    - name: Build with Maven (for Java & Kotlin)
      run: mvn clean install -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
