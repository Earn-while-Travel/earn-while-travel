spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  hikari:
    connection-timeout: 30000
    maximum-pool-size: 5

  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    show-sql: true
    hibernate:
      ddl-auto: update


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /

server:
  port: 8600
  servlet:
    context-path: /ewt

logging:
  level:
    com.zaxxer.hikari: ERROR  # 🔹 Correct indentation here!
