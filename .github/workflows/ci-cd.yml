name: Java 17 CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17 (Adoptium)
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adoptium'  # Corrected distribution name

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Run tests with Maven
        run: mvn test

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."

      # Clean up orphan processes
      - name: Clean up orphan processes
        run: |
          ps aux | grep '[o]rphan_process' | awk '{print $2}' | xargs kill -9 || true
